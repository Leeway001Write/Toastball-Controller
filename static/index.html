<!DOCTYPE html>
<html>
    <head>
        <title>Toasterball Controller</title>
        <link rel="stylesheet" href="./index.css?v=1">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    </head>

    <body>
        <div id="left-side">
            <div id="joystick-mount" class="joystick">
                <div id="joystick-handle" class="joystick">
                    <p>0</p>
                </div>
            </div>
        </div>
        <div id="right-side">
            <div id="button-Y" class="circle-button">Y</div>
            <div id="button-X" class="circle-button">X</div>
            <div id="button-B" class="circle-button">B</div>
            <div id="button-A" class="circle-button">A</div>
        </div>

        <script>
            const InputType = {
                CONNECT: 0x00,
                AXIS: 0x01,
                BUTTON: 0x02,
                SLIDER: 0x03
            }
            const Xbox360Button = {
                Up: 12,
                Down: 13,
                Left: 14,
                Right: 15,
                Start: 8,
                Back: 9,
                LeftThumb: 10,
                RightThumb: 11,
                LeftShoulder: 4,
                RightShoulder: 5,
                Guide: 7,
                A: 0,
                B: 1,
                X: 2,
                Y: 3
            }
            const Xbox360Axis = {
                LeftThumb: 1,
                RightThumb: 2

            }
            const Xbox360Slider = {
                LeftTrigger: 1,
                RightTrigger: 2
            }
            const ButtonState = {
                PRESSED: 1,
                UNPRESSED: 0
            }

            const socket = new WebSocket("ws://" + location.host + "/ws");

            document.addEventListener('dblclick', function(event) {
                event.preventDefault();
            }, { passive: false });


            const buttonA = document.getElementById("button-A");
            const buttonB = document.getElementById("button-B");
            const buttonX = document.getElementById("button-X");
            const buttonY = document.getElementById("button-Y");

            const joystick_mount = document.getElementById("joystick-mount");
            const joystick_handle = document.getElementById("joystick-handle");

            socket.addEventListener("message", updatePlayerNumber, false)

            buttonA.addEventListener("pointerdown", () => { buttonA.classList.add("pressed-button"); sendButton(Xbox360Button.A, true); });
            buttonA.addEventListener("pointerup", () => { buttonA.classList.remove("pressed-button"); sendButton(Xbox360Button.A, false); });
            buttonA.addEventListener("pointercancel", () => { buttonA.classList.remove("pressed-button"); sendButton(Xbox360Button.A, false); });

            buttonB.addEventListener("pointerdown", () => { buttonB.classList.add("pressed-button"); sendButton(Xbox360Button.B, true); });
            buttonB.addEventListener("pointerup", () => { buttonB.classList.remove("pressed-button"); sendButton(Xbox360Button.B, false); });
            buttonB.addEventListener("pointercancel", () => { buttonB.classList.remove("pressed-button"); sendButton(Xbox360Button.B, false); });

            buttonX.addEventListener("pointerdown", () => { buttonX.classList.add("pressed-button"); sendButton(Xbox360Button.X, true); });
            buttonX.addEventListener("pointerup", () => { buttonX.classList.remove("pressed-button"); sendButton(Xbox360Button.X, false); });
            buttonX.addEventListener("pointercancel", () => { buttonX.classList.remove("pressed-button"); sendButton(Xbox360Button.X, false); });

            buttonY.addEventListener("pointerdown", () => { buttonY.classList.add("pressed-button"); sendButton(Xbox360Button.Y, true); });
            buttonY.addEventListener("pointerup", () => { buttonY.classList.remove("pressed-button"); sendButton(Xbox360Button.Y, false); });
            buttonY.addEventListener("pointercancel", () => { buttonY.classList.remove("pressed-button"); sendButton(Xbox360Button.Y, false); });

            joystick_mount.addEventListener("pointerdown", enableJoy, false);
            joystick_mount.addEventListener("pointermove", updateJoy, false);
            joystick_mount.addEventListener("pointerup", resetJoy, false);
            joystick_mount.addEventListener("pointercancel", resetJoy, false);
            window.addEventListener("resize", recalcGeometry, false);
            window.addEventListener("orientationchange", recalcGeometry, false);

            function updatePlayerNumber(event) {
                msg = event.data;

                nextButton.innerText = "P"+msg;
            }


            // BUTTONS

            //

            
            // JOYSTICK

            let joystickPointerId = null;
            const doubleTapForThumbPress = true;
            const shouldMoveJoyOnTap = true;
            let lastTapTime = 0;
            let doubleTapThreshold = 250; // ms

            let handleRect = joystick_handle.getBoundingClientRect();
            let mountRect = joystick_mount.getBoundingClientRect();

            let diameter = handleRect.width;
            let mountOffsetX = mountRect.left;
            let mountOffsetY = mountRect.top;
            let extraLength = 12;

            let offsetX = -mountOffsetX - diameter/2;
            let offsetY = -mountOffsetY - diameter/2;
            let pixelsToCenter = (mountRect.width - handleRect.width) / 2;

            resetJoy();

            function clamp(n, min, max) {
                if (n > max) {
                    return max;
                } else if (n < min) {
                    return min;
                }
                return n;
            }

            function enableJoy(event) {
                if (doubleTapForThumbPress) {
                    const now = performance.now();
    
                    if (now - lastTapTime < doubleTapThreshold) {
                        onDoubleTap(event);
                    }
    
                    lastTapTime = now;
                }

                if (!joystickPointerId) { // IF check prevents weird multitouch behavior
                    joystickPointerId = event.pointerId;
                    joystick_mount.setPointerCapture(event.pointerId);
                    if (shouldMoveJoyOnTap) {
                        updateJoy(event);
                    }
                }
            }

            function updateJoy(event) {
                if (event.pointerId === joystickPointerId) {
                    const x = clamp(event.clientX + offsetX, -extraLength, extraLength + mountRect.width - handleRect.width);
                    const y = clamp(event.clientY + offsetY, -extraLength, extraLength + mountRect.height - handleRect.height);
    
                    joystick_handle.style.transform = `translate(${x}px, ${y}px)`;

                    sendAxis(0, getOutput(x, y).x, getOutput(x,y).y);
                }
            }
            function resetJoy(event) {
                if (!event || event.pointerId === joystickPointerId) {
                    joystickPointerId = null;
                    joystick_handle.style.transform = `translate(${pixelsToCenter}px, ${pixelsToCenter}px)`;
                
                    sendAxis(0, 0, 0);
                    joystick_handle.textContent = "0 \n 0";
                }
            }

            function onDoubleTap(event) {
                console.log("double tap detected");
            }

            function getOutput(x, y) {
                const dx = x - pixelsToCenter;
                const dy = y - pixelsToCenter;

                const distance = Math.hypot(dx, dy);
                const maxDistance = (mountRect.width - handleRect.width)/2;
                const deadZone = maxDistance * 0.15;  // 15% inner dead-zone

                // Inside dead zone — stop movement entirely
                if (distance < deadZone) {
                    return { x: 0, y: 0 };
                }

                // Normalize direction
                const nx = dx / distance;
                const ny = dy / distance;

                // Remap distance from dead-zone boundary → max boundary
                let scaledDist = (distance - deadZone) / (maxDistance - deadZone);
                scaledDist = Math.min(scaledDist, 1);

                return {
                    x: nx * scaledDist,   // range: -1 → +1
                    y: -ny * scaledDist
                };
            }


            function recalcGeometry() {
                handleRect = joystick_handle.getBoundingClientRect();
                mountRect = joystick_mount.getBoundingClientRect();

                diameter = handleRect.width;
                mountOffsetX = mountRect.left;
                mountOffsetY = mountRect.top;
                extraLength = 12;

                offsetX = -mountOffsetX - diameter/2;
                offsetY = -mountOffsetY - diameter/2;
                pixelsToCenter = (mountRect.width - handleRect.width) / 2;

                resetJoy();
            }

            function sendButton(buttonId, isPressed) {
                let val = 0x00;
                if (isPressed) {
                    val = 0x01;
                }

                const buffer = packMessage(InputType.BUTTON, buttonId, val, 0x00);
                socket.send(buffer);

                
            }

            function sendAxis(axisId, nx, ny) {
                const buffer = packMessage(InputType.AXIS, axisId, nx, ny);
                socket.send(buffer);
            }

            function packMessage(msgType, id, valX, valY) {
                const ubuf = new Uint8Array(5);
                const sbuf = new Int8Array(5);

                sbuf[0] = 0x00; // Server will fill this field
                sbuf[1] = msgType;

                switch (msgType) {
                    case InputType.AXIS: 
                        // Convert normalized axis input to 8-bit signed value
                        let xInt = Math.round(valX * 127);
                        let yInt = Math.round(valY * 127);

                        sbuf[2] = id;
                        sbuf[3] = xInt;
                        sbuf[4] = yInt;

                        joystick_handle.textContent = xInt + '\n' + yInt;
                        break;

                    case InputType.BUTTON: 
                        sbuf[2] = id;
                        sbuf[3] = valX;
                        break;

                    case InputType.CONNECT: 
                        break;

                    default:
                        console.warn("Sending unknown input message type");
                }

                return sbuf;
            }

            socket.addEventListener('open',  () => {
                socket.send(packMessage(InputType.CONNECT));
                console.log("Sent connect request");
            });
        </script>
    </body>
</html>
