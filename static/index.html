<!DOCTYPE html>
<html>
    <head>
        <title>Toasterball Controller</title>
        <link rel="stylesheet" href="./index.css">
    </head>

    <body>
        <div id="buttonContainer">
            <div id="joystick-mount" class="joystick">
                <div id="joystick-handle" class="joystick">
                    <p>0</p>
                </div>
            </div>
            <div id="leftButton">&lt</div>
            <div id="rightButton">></div>
        </div>
        <div id="menuContainer">
            <div id="backButton">esc</div>
            <div id="middleButton">v GRAB v</div>
            <div id="nextButton">[></div>
        </div>

        <script>
            /**
             * Send updated button data to server
             * 
             * +-----buffer-----+
             * [0,      0       ]
             *  button  pressed?
             *  (L=0)
             *  (R=1)
             *  (B=2)
             *  (M=3)
             *  (N=4)
            */
            const Xbox360Button = {
                Up: 12,
                Down: 13,
                Left: 14,
                Right: 15,
                Start: 8,
                Back: 9,
                LeftThumb: 10,
                RightThumb: 11,
                LeftShoulder: 4,
                RightShoulder: 5,
                Guide: 7,
                A: 0,
                B: 1,
                X: 2,
                Y: 3
            }
            const Xbox360Axis = {
                LeftThumbX: 99,
                LeftThumbY: 99,
                RightThumbX: 99,
                RightThumbY: 99

            }
            const Xbox360Slider = {
                LeftTrigger: 99,
                RightTrigger: 99
            }
            const ButtonState = {
                PRESSED: 1,
                UNPRESSED: 0
            }

            const COLOR_L = "crimson";
            const COLOR_R = "cornflowerblue";
            const COLOR_L_PRESSED = "black";
            const COLOR_R_PRESSED = "black";
            const COLOR_B = "darkgrey";
            const COLOR_B_PRESSED = "black";
            const COLOR_M = "bisque";
            const COLOR_M_PRESSED = "brown";
            const COLOR_N = "darkgrey";
            const COLOR_N_PRESSED = "black";

            const socket = new WebSocket("ws://" + location.host + "/ws");
            const leftButton = document.getElementById("leftButton");
            const rightButton = document.getElementById("rightButton");
            const backButton = document.getElementById("backButton");
            const middleButton = document.getElementById("middleButton");
            const nextButton = document.getElementById("nextButton");
            const joystick_mount = document.getElementById("joystick-mount");
            const joystick_handle = document.getElementById("joystick-handle");

            socket.addEventListener("message", updatePlayerNumber, false)

            leftButton.addEventListener("touchstart", pressLeft, false);
            leftButton.addEventListener("touchend", releaseLeft, false);
            rightButton.addEventListener("touchstart", pressRight, false);
            rightButton.addEventListener("touchend", releaseRight, false);
            backButton.addEventListener("touchstart", pressBack, false);
            backButton.addEventListener("touchend", releaseBack, false);
            middleButton.addEventListener("touchstart", pressMiddle, false);
            middleButton.addEventListener("touchend", releaseMiddle, false);
            nextButton.addEventListener("touchstart", pressNext, false);
            nextButton.addEventListener("touchend", releaseNext, false);
            joystick_mount.addEventListener("pointerdown", enableJoy, false);
            joystick_mount.addEventListener("pointermove", updateJoy, false);
            joystick_mount.addEventListener("pointerup", resetJoy, false);
            joystick_mount.addEventListener("pointercancel", resetJoy, false);
            window.addEventListener("resize", recalcGeometry, false);
            window.addEventListener("orientationchange", recalcGeometry, false);

            leftButton.style.backgroundColor = COLOR_L;
            rightButton.style.backgroundColor = COLOR_R;
            backButton.style.backgroundColor = COLOR_B;
            middleButton.style.backgroundColor = COLOR_M;
            nextButton.style.backgroundColor = COLOR_N;

            function updatePlayerNumber(event) {
                msg = event.data;

                nextButton.innerText = "P"+msg;
            }

            function pressLeft(event) {
                event.preventDefault();

                sendPresses(0,1);
                leftButton.style.backgroundColor = COLOR_L_PRESSED;
            }
            function releaseLeft(event) {
                event.preventDefault();

                sendPresses(0,0);
                leftButton.style.backgroundColor = COLOR_L;
            }
            function pressRight(event) {
                event.preventDefault();

                sendPresses(1,1);
                rightButton.style.backgroundColor = COLOR_R_PRESSED;
            }
            function releaseRight(event) {
                event.preventDefault();

                sendPresses(1,0);
                rightButton.style.backgroundColor = COLOR_R;
            }

            function pressBack(event) {
                event.preventDefault();

                sendPresses(2,1);
                backButton.style.backgroundColor = COLOR_B_PRESSED;
            }
            function releaseBack(event) {
                event.preventDefault();

                sendPresses(2,0);
                backButton.style.backgroundColor = COLOR_B;
            }
            function pressMiddle(event) {
                event.preventDefault();

                sendPresses(3,1);
                middleButton.style.backgroundColor = COLOR_M_PRESSED;
            }
            function releaseMiddle(event) {
                event.preventDefault();

                sendPresses(3,0);
                middleButton.style.backgroundColor = COLOR_M;
            }
            function pressNext(event) {
                event.preventDefault();

                sendPresses(4,1);
                nextButton.style.backgroundColor = COLOR_N_PRESSED;
            }
            function releaseNext(event) {
                event.preventDefault();

                sendPresses(4,0);
                nextButton.style.backgroundColor = COLOR_N;
            }

            let joystickPointerId = null;

            let handleRect = joystick_handle.getBoundingClientRect();
            let mountRect = joystick_mount.getBoundingClientRect();

            let diameter = handleRect.width;
            let mountOffsetX = mountRect.left;
            let mountOffsetY = mountRect.top;
            let extraLength = 12;

            let offsetX = -mountOffsetX - diameter/2;
            let offsetY = -mountOffsetY - diameter/2;
            let pixelsToCenter = (mountRect.width - handleRect.width) / 2;

            resetJoy();

            function clamp(n, min, max) {
                if (n > max) {
                    return max;
                } else if (n < min) {
                    return min;
                }
                return n;
            }

            function enableJoy(event) {
                if (!joystickPointerId) { // IF check prevents weird multitouch behavior
                    joystickPointerId = event.pointerId;
                    joystick_mount.setPointerCapture(event.pointerId);
                }
            }

            function updateJoy(event) {
                if (event.pointerId === joystickPointerId) {
                    const x = clamp(event.clientX + offsetX, -extraLength, extraLength + mountRect.width - handleRect.width);
                    const y = clamp(event.clientY + offsetY, -extraLength, extraLength + mountRect.height - handleRect.height);
    
                    joystick_handle.style.transform = `translate(${x}px, ${y}px)`;
                }
            }
            function resetJoy(event) {
                if (event.pointerId === joystickPointerId) {
                    joystickPointerId = null;
                    joystick_handle.style.transform = `translate(${pixelsToCenter}px, ${pixelsToCenter}px)`;
                }
            }

            function recalcGeometry() {
                handleRect = joystick_handle.getBoundingClientRect();
                mountRect = joystick_mount.getBoundingClientRect();

                diameter = handleRect.width;
                mountOffsetX = mountRect.left;
                mountOffsetY = mountRect.top;
                extraLength = 12;

                offsetX = -mountOffsetX - diameter/2;
                offsetY = -mountOffsetY - diameter/2;
                pixelsToCenter = (mountRect.width - handleRect.width) / 2;
            }

            /**
             * Send updated button data to server
             * 
             * +-----buffer-----+
             * [0,      0       ]
             *  button  pressed?
             *  (L=0)
             *  (R=1)
             *  (B=2)
             *  (M=3)
             *  (N=4)
            */
            function sendPresses(side, isPressed) {
                const buffer = new Uint8Array(2);

                const view = new DataView(buffer.buffer);
                view.setUint8(0, side);
                view.setUint8(1, isPressed);

                socket.send(buffer);
            }
        </script>
    </body>
</html>
