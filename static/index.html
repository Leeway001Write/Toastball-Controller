            // BUTTONS

            // JOYSTICK

            // ==========================
            // DYNAMIC JOYSTICK (SPAWN-AT-TOUCH)
            // ==========================

            const joystickBox = document.getElementById("joystick-box");

            let joyPointerId = null;
            let joyOrigin = { x: 0, y: 0 };
            let joyRadius = 0;

            const DEADZONE_RATIO = 0.15;

            // Ensure handle starts hidden
            joystick_mount.style.display = "none";

            joystickBox.addEventListener("pointerdown", onJoyStart);
            joystickBox.addEventListener("pointermove", onJoyMove);
            joystickBox.addEventListener("pointerup", onJoyEnd);
            joystickBox.addEventListener("pointercancel", onJoyEnd);

            function onJoyStart(e) {
                if (joyPointerId !== null) return;

                joyPointerId = e.pointerId;
                joystickBox.setPointerCapture(e.pointerId);

                joyOrigin.x = e.clientX;
                joyOrigin.y = e.clientY;

                joyRadius = joystickBox.clientWidth * 0.35;

                joystick_mount.style.display = "flex";
                joystick_mount.style.transform =
                    `translate(${joyOrigin.x}px, ${joyOrigin.y}px) translate(-50%, -50%)`;

                joystick_handle.style.transform = `translate(0px, 0px)`;

                sendAxis(0, 0, 0);
            }

            function onJoyMove(e) {
                if (e.pointerId !== joyPointerId) return;

                const dx = e.clientX - joyOrigin.x;
                const dy = e.clientY - joyOrigin.y;

                const distance = Math.hypot(dx, dy);
                const clampedDist = Math.min(distance, joyRadius);

                const nx = distance === 0 ? 0 : dx / distance;
                const ny = distance === 0 ? 0 : dy / distance;

                const deadzone = joyRadius * DEADZONE_RATIO;
                let magnitude = 0;

                if (clampedDist > deadzone) {
                    magnitude = (clampedDist - deadzone) / (joyRadius - deadzone);
                }

                const outX = nx * magnitude;
                const outY = ny * magnitude;

                joystick_handle.style.transform =
                    `translate(${nx * clampedDist}px, ${ny * clampedDist}px)`;

                sendAxis(0, outX, -outY);
            }

            function onJoyEnd(e) {
                if (e.pointerId !== joyPointerId) return;

                joyPointerId = null;

                joystick_mount.style.display = "none";
                joystick_handle.style.transform = `translate(0px, 0px)`;

                sendAxis(0, 0, 0);
            }


            function sendButton(buttonId, isPressed) {
                let val = 0x00;
                if (isPressed) {
                    val = 0x01;
                }

                const buffer = packMessage(InputType.BUTTON, buttonId, val, 0x00);
                socket.send(buffer);

                
            }

            function sendAxis(axisId, nx, ny) {
                const buffer = packMessage(InputType.AXIS, axisId, nx, ny);
                socket.send(buffer);
            }

            function packMessage(msgType, id, valX, valY) {
                const ubuf = new Uint8Array(5);
                const sbuf = new Int8Array(5);

                sbuf[0] = 0x00; // Server will fill this field
                sbuf[1] = msgType;

                switch (msgType) {
                    case InputType.AXIS: 
                        // Convert normalized axis input to 8-bit signed value
                        let xInt = Math.round(valX * 127);
                        let yInt = Math.round(valY * 127);

                        sbuf[2] = id;
                        sbuf[3] = xInt;
                        sbuf[4] = yInt;

                        joystick_handle.textContent = xInt + '\n' + yInt;
                        break;

                    case InputType.BUTTON: 
                        sbuf[2] = id;
                        sbuf[3] = valX;
                        break;

                    case InputType.CONNECT: 
                        break;

                    default:
                        console.warn("Sending unknown input message type");
                }

                return sbuf;
            }

            socket.addEventListener('open',  () => {
                socket.send(packMessage(InputType.CONNECT));
                console.log("Sent connect request");
            });
